{n:'Living room',wall:'#FFD3B0',wall2:'#FFC49A',floor:'#E3A064',line:'#B9753A',acc:'#2FB5A0'},

/* ---------- audio ---------- */
var AC=null,NB=null,hopSeq=0,MB=null,SB=null,MASTER=null,ANA=null,voices=0;
var musV=store.get('musv',0.7),sfxV=store.get('sfxv',0.9);
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}
    if(AC){
      var cmp=AC.createDynamicsCompressor();cmp.threshold.value=-16;cmp.knee.value=12;cmp.ratio.value=8;cmp.attack.value=0.004;cmp.release.value=0.2;

      MB.connect(MASTER);SB.connect(MASTER);MASTER.connect(cmp);cmp.connect(ANA);cmp.connect(AC.destination);
      try{var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){}
    }}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}

}
function setMute(m){muted=m;if(MASTER&&AC)MASTER.gain.setTargetAtTime(m?0:0.85,AC.currentTime,0.05);save();}
function setVols(){if(MB)MB.gain.setTargetAtTime(musV*0.55*duckK,AC.currentTime,0.08);if(SB)SB.gain.setTargetAtTime(sfxV,AC.currentTime,0.05);store.set('musv',musV);store.set('sfxv',sfxV);}
var duckK=1;
function nbuf(){if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.5),AC.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
/* one voice: osc through gain env, to bus. bus: 0 sfx, 1 music */
function V(type,f1,f2,t,dur,vol,bus,pan,filt){
  var a=AC;if(!a)return;if(bus===0&&voices>36)return;
  var o=a.createOscillator(),g=a.createGain(),out=g;
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);

}
function N(dur,vol,ft,fc,fc2,t,bus,pan,q){
  var a=AC;if(!a)return;if(bus===0&&voices>36)return;
  var s=a.createBufferSource();s.buffer=nbuf();var f=a.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(fc,t);if(fc2)f.frequency.exponentialRampToValueAtTime(fc2,t+dur);f.Q.value=q||1;

function petBehave(o){

    if(o.beh===0&&o.x<sock.x+270){o.beh=1;o.cnt=20;o.extra=-speed*0.9;}
    else if(o.beh===1){o.cnt--;if(o.cnt<=0){o.beh=2;o.extra=5.0;}}
